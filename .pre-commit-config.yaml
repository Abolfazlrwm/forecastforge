# Pre-commit configuration for ForecastForge.
# Install locally with: pre-commit install
# Run against all files with: pre-commit run --all-files
# See https://pre-commit.com for full documentation.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: check-yaml
        name: check yaml syntax
        args: [--allow-multiple-documents]
      - id: check-toml
        name: check toml syntax
      - id: check-added-large-files
        name: block large file commits
        args: [--maxkb=1024]
      - id: check-merge-conflict
        name: check for merge conflict markers
      - id: check-case-conflict
        name: check for case-conflicting filenames
      - id: mixed-line-ending
        name: normalize line endings
        args: [--fix=lf]
      - id: detect-private-key
        name: detect private keys

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict type check)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src]
