# production.toml — Production environment overrides.
#
# Merged over `configs/settings.toml` by `forecastforge.config.settings.Settings`
# when FORECASTFORGE_ENV=production. Only settings that differ from the
# base defaults are declared here. Secrets (credentials, connection
# strings) must never be placed in this file — they belong in
# environment variables (see `.env.example`).

[project]
environment = "production"

[logging]
level = "INFO"
