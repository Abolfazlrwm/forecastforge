# logging.yaml — Minimal structured logging configuration for ForecastForge.
#
# Loaded via Python's `logging.config.dictConfig`. Kept intentionally
# minimal for the repository-bootstrap phase: a console handler with a
# human-readable formatter. File/JSON handlers and log-shipping
# configuration will be added alongside observability work (see the
# roadmap in README.md).

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

loggers:
  forecastforge:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
