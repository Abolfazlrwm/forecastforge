# development.toml — Development environment overrides.
#
# Merged over `configs/settings.toml` by `forecastforge.config.settings.Settings`
# when the active environment (FORECASTFORGE_ENV, default "development")
# resolves to "development". Only settings that differ from the base
# defaults are declared here; anything not listed inherits from
# `settings.toml`.

[project]
environment = "development"

[logging]
level = "DEBUG"
