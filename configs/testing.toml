# testing.toml — Test environment overrides.
#
# Values here are merged over `configs/settings.toml` when
# FORECASTFORGE_ENV=testing (e.g. during `pytest` runs and CI). Only
# settings that differ from the base defaults are declared. No
# settings-loading/merging logic is implemented yet (see
# docs/development.md).

[project]
environment = "testing"

[logging]
level = "WARNING"

[paths]
# Tests should never read or write the developer's real data/model
# directories; a dedicated, ephemeral location will be used once a
# settings loader exists.
data_dir = "data/.testing"
models_dir = "models/.testing"
mlruns_dir = "mlruns/.testing"

[pipeline]
enabled = false
