# testing.toml — Test environment overrides.
#
# Merged over `configs/settings.toml` by `forecastforge.config.settings.Settings`
# when FORECASTFORGE_ENV=testing (e.g. during `pytest` runs and CI).
# Only settings that differ from the base defaults are declared here.

[project]
environment = "testing"

[logging]
level = "WARNING"

[paths]
# Tests should never read or write a developer's real data/model/
# artifact directories.
data_dir = "data/.testing"
models_dir = "models/.testing"
artifacts_dir = "artifacts/.testing"
mlruns_dir = "mlruns/.testing"
