name: Bug report
description: Report something that is broken or behaves unexpectedly.
title: "fix: <short description of the bug>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Please do **not** report security vulnerabilities here — see
        [SECURITY.md](https://github.com/Abolfazlrwm/forecastforge/blob/main/SECURITY.md)
        for the private reporting process.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am running a supported Python version (3.12 or newer).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        A minimal, self-contained reproduction. Prefer a short code snippet or
        a sequence of commands over a prose description.
      placeholder: |
        1. ...
        2. ...
        3. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Relevant log output or traceback
      description: Paste the full traceback if there is one.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: ForecastForge version
      description: Output of `python -c "import forecastforge; print(forecastforge.__version__)"`, or the commit SHA.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version and operating system
      placeholder: "3.12.4 on Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Additional context that might help diagnose the problem.
    validations:
      required: false
