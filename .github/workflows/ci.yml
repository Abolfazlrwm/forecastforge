name: CI

# Continuous integration for ForecastForge.
#
# Scope is intentionally limited to repository-foundation quality gates:
# installing the package, linting, type-checking, and testing. No Docker
# builds, no model training, and no deployment happen in this workflow —
# those will be added in later phases as the corresponding functionality
# is implemented.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type-check with MyPy
        run: mypy src

      - name: Test with pytest
        run: pytest
