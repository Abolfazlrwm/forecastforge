name: Docs

# Build the MkDocs site and publish it to GitHub Pages on every push to
# main. The mkdocstrings handler resolves `forecastforge.*` from the source
# tree (see the `paths` option in mkdocs.yml), but the package is installed
# anyway so the docstrings are picked up from a real importable checkout and
# a dependency change that breaks the import fails here, not in review.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; do not cancel an in-flight one, since
# a cancelled deploy can leave the site stale between pushes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the package with the docs extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Configure Pages
        # enablement turns Pages on the first time this workflow runs, so no
        # manual repository setting is needed before the first deployment.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the site (strict)
        run: mkdocs build --strict --site-dir site

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
