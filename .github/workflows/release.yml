name: Release

# Build the distribution when a version tag lands and attach it to the
# GitHub release. The wheel check mirrors CI: an editable install cannot
# catch a broken wheel layout, and a release is exactly the moment that
# matters. The tag must also match the version declared in pyproject.toml,
# so a stale VERSION bump cannot produce an artifact labelled with the
# wrong version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build, verify, and attach the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        run: |
          python - <<'PY'
          import tomllib

          tag = "${{ github.ref_name }}".removeprefix("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != version:
              raise SystemExit(f"tag v{tag} does not match pyproject.toml version {version}")
          print(f"tag matches pyproject.toml: {version}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Install the wheel into a clean venv and import it
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/python -m pip install --upgrade pip
          /tmp/release-check/bin/python -m pip install dist/*.whl
          # Run from a neutral directory so the checked-out source tree
          # cannot shadow the installed package.
          cd /tmp
          /tmp/release-check/bin/python - <<'PY'
          import forecastforge

          expected = "${{ github.ref_name }}".removeprefix("v")
          assert forecastforge.__version__ == expected, (
              f"wheel reports {forecastforge.__version__}, expected {expected}"
          )
          print(f"wheel import OK: {forecastforge.__version__}")
          PY

      - name: Extract the changelog section for this release
        # The release body comes from CHANGELOG.md, not a hand-written
        # workflow string, so the notes stay in one reviewed file. If the
        # version has no section yet (a bump that forgot the changelog), the
        # step fails rather than publishing empty notes.
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "${{ github.ref_name }}".removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          marker = f"## [{version}]"
          start = text.find(marker)
          if start == -1:
              raise SystemExit(
                  f"CHANGELOG.md has no section for {version}; "
                  "add one before tagging the release"
              )
          # Skip to the end of the heading line so the release date after the
          # bracketed version does not leak into the body.
          body_start = text.index("\n", start) + 1
          next_heading = text.find("\n## [", body_start)
          body = text[body_start:next_heading].strip() if next_heading != -1 else text[body_start:].strip()
          if not body:
              raise SystemExit(f"the CHANGELOG.md section for {version} is empty")

          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"extracted {len(body.splitlines())} lines of release notes for {version}")
          PY

      - name: Upload the distribution to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "ForecastForge $GITHUB_REF_NAME" \
                 --notes-file release_notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
