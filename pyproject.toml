[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "forecastforge"
version = "0.1.0"
description = "ForecastForge: a production-grade, open-source forecasting platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ForecastForge Contributors" },
]
maintainers = [
    { name = "ForecastForge Contributors" },
]
keywords = ["forecasting", "mlops", "machine-learning", "time-series"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core runtime dependencies. The data layer makes NumPy and pandas genuine
# requirements rather than optional extras: every forecasting stage consumes
# a pandas DataFrame, and pretending otherwise would mean optional-import
# branches in code that can never actually run without them. Heavier or
# network-dependent libraries stay behind extras (`data`, `torch`).
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "typing-extensions>=4.11; python_version < '3.13'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Real market data and the Parquet engine. Kept optional so that a plain
# `pip install forecastforge` stays small and works fully offline.
data = [
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
]
# Plotting support for the example scripts and notebooks.
viz = [
    "matplotlib>=3.8.0",
]
dev = [
    "build>=1.2.0",
    "pandas-stubs>=2.2",  # pandas does not ship its own type information
    "pyarrow>=15.0",  # so the Parquet code paths are covered in CI
    "ruff>=0.17.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Abolfazlrwm/forecastforge"
Repository = "https://github.com/Abolfazlrwm/forecastforge"
Issues = "https://github.com/Abolfazlrwm/forecastforge/issues"
Changelog = "https://github.com/Abolfazlrwm/forecastforge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# The value must be the importable package directory, not the src root.
# With "src", hatchling treats src/ as the package itself and archives the
# files under a src/ prefix inside site-packages, so a non-editable install
# ships `site-packages/src/forecastforge/` and `import forecastforge` fails.
packages = ["src/forecastforge"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "data",
    "examples",
    "mlruns",
    "models",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "PERF", # perflint
]
ignore = [
    "PLR0913", # too-many-arguments (revisit once real APIs exist)
]
unfixable = ["ERA001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "PLR2004"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["forecastforge"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["forecastforge"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/forecastforge",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/forecastforge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
fail_under = 85
show_missing = true
